name: Release
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["package.json", "src/**", "build/**", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions: { contents: read }

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: installer-windows, path: dist/*.exe, if-no-files-found: error }

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --mac --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with: { name: installer-macos, path: dist/*.dmg, if-no-files-found: error }

  publish-win:
    needs: build-win
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: installer-windows, path: out }
      - name: Publish release assets
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", REPO: "${{ github.repository }}", SHA: "${{ github.sha }}" }
        run: bash .github/scripts/publish.sh

  publish-mac:
    needs: build-mac
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: installer-macos, path: out }
      - name: Publish release assets
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", REPO: "${{ github.repository }}", SHA: "${{ github.sha }}" }
        run: bash .github/scripts/publish.sh
