name: Release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - name: Build macOS dmg (arm64 + x64)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Create GitHub release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          sha256sum out/* > out/SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --title "Bunnys Invoice Generator ${{ github.ref_name }}" --generate-notes
