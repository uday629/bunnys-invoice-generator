name: Release
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["package.json", "src/**", "build/**", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - name: Build macOS dmg (arm64 + x64)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: actions/checkout@v4
        with: { sparse-checkout: package.json, sparse-checkout-cone-mode: false, path: src-meta }
      - name: Create GitHub release (once per version)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          VER="v$(node -p "require('./src-meta/package.json').version")"
          if gh release view "$VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then echo "Release $VER already exists - skipping"; exit 0; fi
          sha256sum out/* > out/SHA256SUMS.txt
          gh release create "$VER" out/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Bunnys Invoice Generator $VER" --generate-notes
